kind = "web"
previewPath = "/"
title = "Web Landing"
description = "Multilingual portfolio source-code storefront with server-rendered sales content, verified customer accounts, VietQR bank-transfer orders confirmed by the admin, source downloads, and a Vietnamese admin dashboard."
version = "1.0.0"
id = "artifacts/web-landing"
router = "path"

[[services]]
name = "web"
paths = ["/"]
localPort = 18500

[services.development]
run = "pnpm --filter @workspace/web-landing run dev"

[services.production]
build = ["pnpm", "--filter", "@workspace/web-landing", "run", "build"]

[services.production.run]
args = ["pnpm", "--filter", "@workspace/web-landing", "run", "serve"]

[services.production.run.env]
NODE_ENV = "production"

[services.env]
PORT = "18500"
BASE_PATH = "/"
