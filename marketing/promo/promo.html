const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const prog = (t, t0, d) => clamp((t - t0) / d);
const eOut = (k) => 1 - Math.pow(1 - k, 3);
const eIn = (k) => k * k * k;
const eInOut = (k) => 0.5 - Math.cos(Math.PI * k) / 2;
const eBack = (k, s = 1.5) => (k >= 1 ? 1 : 1 + (s + 1) * Math.pow(k - 1, 3) + s * Math.pow(k - 1, 2));
const stepped = (k, n) => (k >= 1 ? 1 : Math.floor(k * n) / n);

function bounce(k) {
  const n1 = 7.5625, d1 = 2.75;
  if (k < 1 / d1) return n1 * k * k;
  if (k < 2 / d1) return n1 * (k -= 1.5 / d1) * k + 0.75;
  if (k < 2.5 / d1) return n1 * (k -= 2.25 / d1) * k + 0.9375;
  return n1 * (k -= 2.625 / d1) * k + 0.984375;
}
// Pixel-stepped pop: jumps through a few scales like the site's steps() transitions.
function pop(k) {
  if (k <= 0) return 0;
  if (k >= 1) return 1;
  const seq = [0.4, 0.75, 1.1, 1.12, 1.04, 1];
  return seq[Math.min(seq.length - 1, Math.floor(k * seq.length))];
}

function sprite(art, pal, px, extra = "") {
  const rows = art.trim().split("\n").map((r) => r.trim());
  const w = Math.max(...rows.map((r) => r.length)), h = rows.length;
  let out = "";
  rows.forEach((row, y) => {
    let x = 0;
    while (x < row.length) {
      const c = row[x];
      if (c === "." || !pal[c]) { x++; continue; }
      let run = 1;
      while (row[x + run] === c) run++;
      out += `<rect x="${x}" y="${y}" width="${run}" height="1" fill="${pal[c]}"/>`;
      x += run;
    }
  });
  return `<svg width="${w * px}" height="${h * px}" viewBox="0 0 ${w} ${h}" ${extra}>${out}</svg>`;
}

  const scale = sx !== null ? `scale(${sx}, ${sy ?? sx})` : `scale(${s})`;

  node.style.opacity = o >= 1 ? "" : String(o);

// S5: end card
const visit = el(`<div style="font-weight:800;font-size:44px;color:#10230f;background:#f6c945;border:9px solid #1b2a1c;padding:6px 22px;box-shadow:12px 12px 0 rgba(16,64,20,.35)">${COPY.visit}</div>`);
const url = el(`<div class="tile" style="padding:26px 40px"><div class="word" style="font-size:66px;color:#10230f;letter-spacing:0">shopoatdopac.com</div></div>`);
const sparks = Array.from({ length: 10 }, (_, i) => el(`<div style="width:15px;height:15px;background:${i % 2 ? "#f6c945" : "#e3392b"}"></div>`));
const mush = [el(sprite(MUSHROOM, MUSH_PAL, 9)), el(sprite(MUSHROOM, MUSH_PAL, 7))];

// Layering: road + rider under everything, cards over the caption tile, etc. (DOM order is the z-order)

/* ===== fit long single-line texts into their boxes ===== */
function fitText(node, maxW, minPx) {
  let size = parseFloat(getComputedStyle(node).fontSize);
  while (node.scrollWidth > maxW && size > minPx) { size -= 1; node.style.fontSize = size + "px"; }
}

/* ===== timeline ===== */
const T = {
  hookIn: 0.08, hookOut: 2.95,
  drop: 1.35, s2: 3.0, phoneIn: 3.05, footStart: 3.4,
  s3: 10.0, cards: [10.35, 10.65, 10.95], badge: 11.5, pay: 12.1,
  s4: 16.5, steps: [16.85, 17.2, 17.55, 17.9], chat: 18.5,
  s5: 20.5, endMark: 20.75, endWord: 21.2, visit: 21.75, url: 21.95,
};
const SPEED = 60; // grass + road scroll, px/s (the rider walks down the road)
function worldY(t) {
  const stop0 = T.s5, stopLen = 1.0;
  if (t <= stop0) return SPEED * t;
  const tau = Math.min(t - stop0, stopLen);
  return SPEED * stop0 + SPEED * (tau - (tau * tau) / (2 * stopLen));
}

/* ===== layout constants ===== */
const CAP_X = CX - 375, CAP_Y = 248;
const HOOK_X = CX - 375, HOOK_Y = 300;
const PHONE_X = CX - 280, PHONE_Y = 520;
const CARD_X = CX - 375, CARD_Y = [540, 830, 1120];
const STEP_X = CX - 375, STEP_Y = [536, 683, 830, 977];
let MARK_W, MARK_H, WORD_W, WORD_H, TAG_W, URL_W, URL_H, VISIT_W, CHIP_W;

let lastFoot = -1;
async function setFoot(i) {
  if (i === lastFoot) return;
  lastFoot = i;
  foot.src = FOOT_DIR + "f" + String(i).padStart(4, "0") + ".jpg";
  await foot.decode().catch(() => {});
}

function render(t) {
  /* world */
  const wy = worldY(t);
  V.style.backgroundPosition = `0px ${-snap(wy, 3)}px`;
  document.getElementById("dash").style.backgroundPosition = `0px ${-snap(wy, 3)}px`;
  const walking = t < T.s5 + 0.9;
  const fr = walking ? Math.floor(t / 0.22) % 2 : 0;
  // A little hop when the address appears.
  const hop = t > T.url && t < T.url + 0.45 ? -snap(Math.sin(prog(t, T.url, 0.45) * Math.PI) * 36, 9) : 0;
  place(riderA, { x: ROAD_X - 45, y: RIDER_Y - 126 + hop, o: fr === 0 ? 1 : 0 });
  place(riderB, { x: ROAD_X - 45, y: RIDER_Y - 126 + hop, o: fr === 1 ? 1 : 0 });
  place(riderShadow, { x: ROAD_X - 48, y: RIDER_Y - 6 });
  // Stop pins pass the rider at each scene change; the finish trophy parks just below her at the end.
  [T.s2, T.s3, T.s4].forEach((tp, i) => {
    const y = RIDER_Y + worldY(tp) - wy;
    place(pins[i], { x: ROAD_X - 21, y: snap(y - 60, 3), o: y > -80 && y < H + 80 ? 1 : 0 });
  });
  const ty = RIDER_Y + 170 + worldY(DUR) - wy;
  place(trophy, { x: ROAD_X - 33, y: snap(ty - 30, 3), o: ty < H + 80 ? 1 : 0 });

  /* S1 hook */
  const hIn = prog(t, T.hookIn, 0.3), hOut = eIn(prog(t, T.hookOut, 0.35));
  place(hook, { x: HOOK_X, y: snap(HOOK_Y - hOut * 900), s: pop(hIn), o: t < T.hookOut + 0.36 ? 1 : 0 });
  hookEyebrow.style.clipPath = wipe(prog(t, 0.18, 0.2), 6);
  hookLines.forEach((ln, i) => { ln.style.clipPath = wipe(prog(t, 0.3 + i * 0.22, 0.22), 8); });

  /* logo drop (S1) and end card (S5) share the mark + wordmark */
  let mx, my, ms = 1, mo = 0, wo = 0, wyy, wsc = 1, tagO = 0, tagY = 0;
  if (t < T.s5) {
    const k = prog(t, T.drop, 0.6);
    const landY = 870;
    my = landY - (1 - bounce(k)) * 1100;
    mx = CX - MARK_W / 2;
    mo = t >= T.drop && t < T.s2 + 0.4 ? 1 : 0;
    const out = eIn(prog(t, T.s2 - 0.05, 0.35));
    my += out * 1100;
    wyy = landY + MARK_H - 30 + out * 1100;
    wo = mo;
    tagY = wyy + WORD_H + 26;
    tagO = mo && t > T.drop + 1.0 ? 1 : 0;
    letterPop(t, T.drop + 0.55);
    place(tag, { x: CX - TAG_W / 2, y: snap(tagY), s: pop(prog(t, T.drop + 1.0, 0.25)), o: tagO });
  } else {
    const k = prog(t, T.endMark, 0.6);
    const landY = 430;
    my = landY - (1 - bounce(k)) * 1300;
    mx = CX - MARK_W * 1.25 / 2;
    ms = 1.25;
    mo = t >= T.endMark ? 1 : 0;
    wyy = landY + MARK_H * 1.25 - 40;
    wsc = 1.2;
    wo = mo;
    letterPop(t, T.endWord);
    place(tag, { o: 0 });
  }
  place(mark, { x: snap(mx), y: snap(my), s: ms, o: mo, origin: "0 0" });
  place(word, { x: snap(CX - (WORD_W * wsc) / 2), y: snap(wyy), s: wsc, o: wo, origin: "0 0" });
  // landing dust
  const landT = t < T.s5 ? T.drop + 0.6 * 0.36 : T.endMark + 0.6 * 0.36;
  const dk = prog(t, landT, 0.35);
  const baseY = t < T.s5 ? 870 + MARK_H - 40 : 430 + MARK_H * 1.25 - 50;
  dust.forEach((d, i) => {
    const dir = i < 3 ? -1 : 1, lane = i % 3;
    const dx = dir * (40 + lane * 46 + stepped(dk, 4) * (60 + lane * 30));
    const dy = -stepped(dk, 4) * (18 + lane * 14);
    place(d, { x: snap(CX + dx - 9), y: snap(baseY + dy), o: dk > 0 && dk < 1 ? 1 - stepped(dk, 4) * 0.75 : 0 });
  });

  /* caption tile S2..S4 */
  const capIn = prog(t, T.s2 + 0.35, 0.3), capOut = eIn(prog(t, T.s5, 0.35));
  place(capTile, { x: CAP_X, y: snap(CAP_Y - capOut * 700), s: pop(capIn), o: t > T.s2 + 0.35 && t < T.s5 + 0.36 ? 1 : 0 });
  CAPS.forEach((c, i) => {
    const next = CAPS[i + 1];
    const kin = prog(t, c.t0 + (i === 0 ? 0.25 : 0.12), 0.3);
    const kout = next ? prog(t, next.t0 - 0.12, 0.16) : 0;
    const on = t >= c.t0 && (!next || t < next.t0 + 0.05);
    const node = caps[i];
    node.style.visibility = on ? "visible" : "hidden";
    node.style.clipPath = kout > 0 ? `inset(-40px 0 -40px ${(stepped(kout, 6) * 100).toFixed(1)}%)` : wipe(kin, 10);
  });

  /* phone */
  const pk = prog(t, T.phoneIn, 0.5), pout = eIn(prog(t, T.s3, 0.4));
  place(phone, { x: PHONE_X, y: snap(H + 40 - eBack(pk, 0.6) * (H + 40 - PHONE_Y) + pout * 1500), o: t >= T.phoneIn && t < T.s3 + 0.41 ? 1 : 0 });

  /* cards */
  // the recommended card bobs gently (in 3 pixel steps) after its badge pops
  const bob = t > T.badge + 0.3 ? -stepped((1 - Math.cos((t - T.badge - 0.3) * Math.PI * 2 / 1.2)) / 2, 3) * 9 : 0;
  cards.forEach((c, i) => {
    const kin = eOut(prog(t, T.cards[i], 0.38));
    const kout = eIn(prog(t, T.s4 + i * 0.08, 0.35));
    const x = CARD_X + (1 - kin) * 900 - kout * 1100;
    place(c, { x: snap(x), y: CARD_Y[i] + (i === 1 ? bob : 0), o: t >= T.cards[i] && kout < 1 ? 1 : 0 });
  });
  badge.style.transform = `scale(${pop(prog(t, T.badge, 0.25))})`;
  badge.style.visibility = t >= T.badge ? "visible" : "hidden";
  const payK = prog(t, T.pay, 0.25), payOut = eIn(prog(t, T.s4, 0.3));
  place(payChip, { x: CX - CHIP_W / 2, y: snap(1402 + payOut * 600), s: pop(payK), o: t >= T.pay && payOut < 1 ? 1 : 0 });

  /* steps + chat */
  steps.forEach((s, i) => {
    const kin = eOut(prog(t, T.steps[i], 0.35));
    const kout = eIn(prog(t, T.s5 + i * 0.06, 0.35));
    place(s, { x: snap(STEP_X + (1 - kin) * 900 - kout * 1100), y: STEP_Y[i], o: t >= T.steps[i] && kout < 1 ? 1 : 0 });
  });
  const ck = prog(t, T.chat, 0.3), cout = eIn(prog(t, T.s5 + 0.24, 0.35));
  place(chat, { x: STEP_X, y: snap(1150 + cout * 900), s: pop(ck), o: t >= T.chat && cout < 1 ? 1 : 0 });

  /* end card extras */
  const urlY = 430 + MARK_H * 1.25 - 40 + WORD_H * 1.2 + 120;
  place(visit, { x: CX - VISIT_W / 2, y: snap(urlY - 92), s: pop(prog(t, T.visit, 0.25)), o: t >= T.visit ? 1 : 0, origin: "50% 100%" });
  place(url, { x: CX - URL_W / 2, y: snap(urlY), s: pop(prog(t, T.url, 0.3)), o: t >= T.url ? 1 : 0 });
  const sk = prog(t, T.url + 0.1, 0.5);
  sparks.forEach((s, i) => {
    const a = (i / sparks.length) * Math.PI * 2 + 0.3;
    const r = 70 + stepped(sk, 5) * 150;
    const cx = CX + Math.cos(a) * (URL_W / 2 + r - 60), cy = urlY + URL_H / 2 + Math.sin(a) * (URL_H / 2 + r * 0.6);
    place(s, { x: snap(cx), y: snap(cy), o: sk > 0 && sk < 1 ? 1 : 0 });
  });
  const mk = prog(t, T.endWord + 0.35, 0.3);
  place(mush[0], { x: snap(CX - WORD_W * 0.6 * 0.5 + 40), y: snap(430 + MARK_H * 1.25 - 40 - 40), s: pop(mk), o: mk > 0 ? 1 : 0, origin: "50% 100%" });
  place(mush[1], { x: snap(CX + WORD_W * 1.2 * 0.5 - 150), y: snap(430 + MARK_H * 1.25 - 40 - 30), s: pop(prog(t, T.endWord + 0.45, 0.3)), o: t > T.endWord + 0.45 ? 1 : 0, origin: "50% 100%" });

  /* footage frame */
  const fi = clamp(Math.round((t - T.footStart) * FPS), 0, FOOT_FRAMES - 1);
  return fi;
}

function letterPop(t, t0) {
  wordLetters.forEach((sp, i) => {
    const k = prog(t, t0 + i * 0.07, 0.22);
    sp.style.transform = `scale(${pop(k)})`;
    sp.style.visibility = k > 0 ? "visible" : "hidden";
  });
}

window.renderAt = async (t) => {
  const fi = render(t);
  if (t >= T.phoneIn - 0.05 && t < T.s3 + 0.45) await setFoot(fi);
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  return true;
};

window.__ready = Promise.all([
  document.fonts.load("800 64px 'Be Vietnam Pro'"),
  document.fonts.load("700 40px 'Be Vietnam Pro'"),
  document.fonts.load("600 34px 'Be Vietnam Pro'"),
  document.fonts.load("500 30px 'Be Vietnam Pro'"),
  document.fonts.load("700 66px 'Pixelify Sans'"),
  document.fonts.load("700 32px 'Silkscreen'"),
]).then(() => document.fonts.ready).then(async () => {
  // measure + fit once fonts are in
  caps.forEach((c) => { fitText(c.querySelector(".ttl"), 650, 44); fitText(c.querySelector(".sub"), 650, 26); });
  cards.forEach((c) => { // shrink a package name only if it overflows the space left beside its price
    const h = c.querySelector("h3");
    let size = 44;
    while (h.scrollWidth > h.clientWidth && size > 30) { size -= 1; h.style.fontSize = size + "px"; }
  });
  { // all step lines share one size: shrink until the widest fits
    const txts = steps.map((s) => s.querySelector(".txt"));
    let size = 40;
    while (Math.max(...txts.map((x) => x.scrollWidth)) > 750 - 24 - 56 - 78 - 26 - 8 && size > 28) { size -= 1; txts.forEach((x) => (x.style.fontSize = size + "px")); }
  }
  fitText(chat.querySelector(".ct"), 750 - 60 - 24 - 77 - 26, 26);
  { // one size for every hook line: shrink the block until its widest line fits
    const hl = hook.querySelector(".hl");
    let size = 84;
    while (Math.max(...hookLines.map((l) => l.scrollWidth)) > 750 - 80 - 24 && size > 56) { size -= 1; hl.style.fontSize = size + "px"; }
  }
  const r = (n) => n.getBoundingClientRect();
  MARK_W = r(mark.firstElementChild).width; MARK_H = r(mark.firstElementChild).height;
  WORD_W = r(word.firstElementChild).width; WORD_H = r(word.firstElementChild).height;
  TAG_W = r(tag.firstElementChild).width;
  URL_W = r(url.firstElementChild).width; URL_H = r(url.firstElementChild).height;
  VISIT_W = r(visit.firstElementChild).width;
  CHIP_W = r(payChip.firstElementChild).width;
  const fontsOk = document.fonts.check("800 64px 'Be Vietnam Pro'") && document.fonts.check("700 66px 'Pixelify Sans'") && document.fonts.check("700 32px 'Silkscreen'");
  const q = new URLSearchParams(location.search);
  if (q.has("t")) await window.renderAt(Number(q.get("t")));
  return fontsOk;
});
</script>
