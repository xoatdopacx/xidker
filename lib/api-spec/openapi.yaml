openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Landing page build packages sold through Whop
  - name: checkout
    description: Whop hosted checkout sessions and verified payment status
  - name: support
    description: Support chat for customers who bought a package
  - name: admin
    description: Studio admin sign-in, chat inbox and the packages on sale
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List purchasable packages
      description: Returns every visible package in every currency. The same package sold in another currency is a separate Whop plan sharing the same key. Sorted by currency, then price ascending.
      parameters:
        - name: lang
          in: query
          required: false
          description: Language for the package name, tagline and features. Defaults to vi. Text comes from Whop (plan title/description and name_<lang> metadata), then from the built-in translations, and falls back to English when a translation is missing or out of date.
          schema:
            $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Packages available for purchase
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
        "400":
          description: Invalid lang value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Start a Whop hosted checkout for a package
      description: Creates a Whop checkout session for the chosen package and returns the hosted checkout URL to send the buyer to. After paying, Whop sends the buyer back to /cam-on?ref={ref}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/{ref}:
    get:
      operationId: getCheckoutStatus
      tags: [checkout]
      summary: Get the verified payment status of a checkout
      description: Asks Whop whether the checkout identified by ref has been paid. Status is "pending" until Whop reports a successful payment.
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatus"
        "404":
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/activate:
    post:
      operationId: activateSupport
      tags: [support]
      summary: Switch on support chat with a paid order
      description: >-
        Checks with Whop that the order is paid, not refunded, and was bought with this email,
        then creates the customer's support account with the chosen password and signs this browser in.
        The order can be given as the Whop payment id (pay_…) or the reference from the thank-you link.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportActivateInput"
      responses:
        "201":
          description: Activated and signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No paid order matches this email and order id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Support chat is already switched on for this email or order; sign in instead
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: The order cannot be checked right now
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/login:
    post:
      operationId: signInSupport
      tags: [support]
      summary: Sign in to support chat with email and password
      description: Only one browser stays signed in per account. Signing in here signs every other browser out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SupportSignInInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/logout:
    post:
      operationId: signOutSupport
      tags: [support]
      summary: Sign this browser out of support chat
      responses:
        "204":
          description: Signed out
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/session:
    get:
      operationId: getSupportSession
      tags: [support]
      summary: Get the support account this browser is signed in to
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportSession"
        "401":
          description: Not signed in; reason "replaced" means the account signed in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
  /support/thread:
    get:
      operationId: getSupportThread
      tags: [support]
      summary: Get the signed-in customer's support conversation
      description: Empty until the customer sends a first message.
      responses:
        "200":
          description: The conversation, newest 200 messages in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
  /support/thread/messages:
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a message in the signed-in customer's conversation
      description: The first message starts the conversation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login:
    post:
      operationId: requestAdminCode
      tags: [admin]
      summary: Check the admin token and email a one-time code
      description: When the token is right, a 6-digit code valid for 10 minutes is emailed to the admin address and an httpOnly cookie ties the code to this browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTokenInput"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCodeChallenge"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin sign-in or email sending is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login/verify:
    post:
      operationId: verifyAdminCode
      tags: [admin]
      summary: Check the emailed code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCodeInput"
      responses:
        "200":
          description: Signed in; the httpOnly admin session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong, expired or already used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, request a new code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: signOutAdmin
      tags: [admin]
      summary: Sign out this admin browser
      responses:
        "204":
          description: Signed out
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations:
    get:
      operationId: listAdminConversations
      tags: [admin]
      summary: List chat conversations, most recent activity first
      responses:
        "200":
          description: Up to 200 conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConversation"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}:
    patch:
      operationId: updateAdminConversation
      tags: [admin]
      summary: Close or reopen a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}/messages:
    get:
      operationId: listAdminMessages
      tags: [admin]
      summary: Read a conversation and mark it as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Newest 500 messages in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatMessage"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendAdminMessage
      tags: [admin]
      summary: Reply in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageInput"
      responses:
        "201":
          description: Reply stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}/translations:
    post:
      operationId: translateAdminMessages
      tags: [admin]
      summary: Translate messages that have no translation yet
      description: >-
        Customer messages are translated into Vietnamese and their language is
        detected; a reply is translated into the customer's language. Only
        messages never tried or whose translation failed are translated again.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTranslateInput"
      responses:
        "200":
          description: The asked messages after translating, in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many translations, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/packages:
    get:
      operationId: listAdminPackages
      tags: [admin]
      summary: List every package on Whop, hidden ones included
      description: >-
        Read straight from Whop, uncached. A package is the group of one-time plans under the shop's
        Whop product that share a metadata key: its VND plan carries the Vietnamese text and its USD plan the English text.
      responses:
        "200":
          description: Packages, cheapest VND price first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminPackage"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createAdminPackage
      tags: [admin]
      summary: Put a new package on sale
      description: Creates the package's VND and USD plans on Whop. The site shows the change within about a minute.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPackageInput"
      responses:
        "201":
          description: Created on Whop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPackage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Whop refused the change; the error says why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many changes, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/packages/{key}:
    put:
      operationId: updateAdminPackage
      tags: [admin]
      summary: Change a package's prices, text, recommended mark or whether it is on sale
      description: >-
        Only the Whop fields that differ are sent. A missing VND or USD plan is created.
        Marking a package recommended clears the mark on every other package.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminPackageInput"
      responses:
        "200":
          description: Saved on Whop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminPackage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Whop refused the change; the error says why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many changes, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteAdminPackage
      tags: [admin]
      summary: Delete a package nobody has bought
      description: Deletes all of the package's plans on Whop. Packages with buyers can only be hidden.
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{1,64}$"
      responses:
        "204":
          description: Deleted on Whop
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The package has buyers, so it can only be hidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Whop refused the change; the error says why
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many changes, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Language:
      type: string
      enum: [vi, en, zh-CN, zh-TW, ja, ko, th, id, ms, fil, km, lo, hi, bn, ur, ar, fa, he, tr, ru, uk, pl, cs, de, fr, es, pt, it, nl, sv, el, ro, hu]
      description: Site language (BCP 47 code)
    Package:
      type: object
      description: A landing page build package, backed by a Whop plan.
      properties:
        id:
          type: string
          description: Whop plan id
        key:
          type: string
          description: Package group. The same package sold in different currencies shares one key (Whop plan metadata "key").
        name:
          type: string
        tagline:
          type: ["string", "null"]
          description: One-line summary of who the package is for
        features:
          type: array
          items:
            type: string
          description: What the buyer gets, in display order
        price:
          type: number
          description: Price in major currency units (e.g. 5990000 = 5.990.000 VND, 249 = $249)
        currency:
          type: string
          description: ISO 4217 currency code, lowercase (e.g. "vnd", "usd")
        billing:
          type: string
          enum: [one_time, recurring]
        billingPeriodDays:
          type: ["integer", "null"]
          description: Days between charges for recurring packages, null for one-time
        recommended:
          type: boolean
          description: True for the package the studio recommends most
      required:
        - id
        - key
        - name
        - tagline
        - features
        - price
        - currency
        - billing
        - billingPeriodDays
        - recommended
    CheckoutInput:
      type: object
      properties:
        packageId:
          type: string
          minLength: 1
      required:
        - packageId
    CheckoutSession:
      type: object
      properties:
        ref:
          type: string
          description: Reference for this checkout, used on the /cam-on page
        purchaseUrl:
          type: string
          description: Whop hosted checkout URL to send the buyer to
      required:
        - ref
        - purchaseUrl
    CheckoutStatus:
      type: object
      properties:
        ref:
          type: string
        status:
          type: string
          enum: [paid, pending]
        packageId:
          type: string
        packageName:
          type: string
        amount:
          type: ["number", "null"]
          description: Amount paid in major currency units, null until paid
        currency:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
          format: date-time
        orderId:
          type: ["string", "null"]
          description: Whop payment id, null until paid. The customer uses it to switch on support chat.
      required:
        - ref
        - status
        - packageId
        - packageName
        - amount
        - currency
        - paidAt
        - orderId
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [visitor, admin]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        translated:
          type: boolean
          description: The reply is shown machine-translated into the customer's language
      required:
        - id
        - sender
        - body
        - createdAt
        - translated
    ChatThread:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - status
        - messages
    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        lang:
          $ref: "#/components/schemas/Language"
      required:
        - message
        - lang
    AdminMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - message
    AdminChatMessage:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [visitor, admin]
        body:
          type: string
          description: The text as written
        createdAt:
          type: string
          format: date-time
        lang:
          type: ["string", "null"]
          description: Language of the body (BCP 47); null while unknown
        translation:
          type: ["string", "null"]
          description: >-
            Customer messages in Vietnamese; replies in the customer's language,
            which is what the customer reads
        translationLang:
          type: ["string", "null"]
          description: Language of the translation, or that a failed reply was meant for
        translationStatus:
          type: ["string", "null"]
          enum: [done, same, failed, null]
          description: >-
            null when not tried yet; same when there is nothing to translate;
            failed means a customer reads the reply as written
      required:
        - id
        - sender
        - body
        - createdAt
        - lang
        - translation
        - translationLang
        - translationStatus
    AdminTranslateInput:
      type: object
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: integer
      required:
        - messageIds
    SupportActivateInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
          description: The email used to pay on Whop
        orderId:
          type: string
          minLength: 1
          maxLength: 100
          description: Whop payment id (pay_…) or the reference from the thank-you link
        password:
          type: string
          minLength: 8
          maxLength: 128
        lang:
          $ref: "#/components/schemas/Language"
      required:
        - email
        - orderId
        - password
        - lang
    SupportSignInInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
        - email
        - password
    SupportSession:
      type: object
      properties:
        email:
          type: string
        orderId:
          type: string
          description: Whop payment id the support chat was switched on with
        packageName:
          type: ["string", "null"]
      required:
        - email
        - orderId
        - packageName
    SupportAuthError:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
          enum: [signed_out, replaced]
          description: replaced means the account signed in on another browser, which signed this one out
      required:
        - error
        - reason
    AdminTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
      required:
        - token
    AdminCodeChallenge:
      type: object
      properties:
        sentTo:
          type: string
          description: The admin address with most of it hidden
        expiresAt:
          type: string
          format: date-time
      required:
        - sentTo
        - expiresAt
    AdminCodeInput:
      type: object
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - code
    AdminSession:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
      required:
        - expiresAt
    AdminConversation:
      type: object
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        orderId:
          type: ["string", "null"]
          description: Whop payment id the customer switched on support chat with
        packageName:
          type: ["string", "null"]
        lang:
          type: string
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        lastMessage:
          type: ["string", "null"]
          description: Start of the newest message
        lastSender:
          type: ["string", "null"]
          enum: [visitor, admin, null]
        unread:
          type: integer
          description: Visitor messages the admin has not opened yet
      required:
        - id
        - name
        - email
        - orderId
        - packageName
        - lang
        - status
        - createdAt
        - lastMessageAt
        - lastMessage
        - lastSender
        - unread
    AdminConversationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
      required:
        - status
    AdminPackageText:
      type: object
      description: A package's text in one language, as stored on Whop
      properties:
        name:
          type: string
        tagline:
          type: ["string", "null"]
        features:
          type: array
          items:
            type: string
      required:
        - name
        - tagline
        - features
    AdminPackage:
      type: object
      properties:
        key:
          type: string
          description: Package group shared by its plans (Whop plan metadata "key")
        vi:
          $ref: "#/components/schemas/AdminPackageText"
        en:
          $ref: "#/components/schemas/AdminPackageText"
        priceVnd:
          type: ["number", "null"]
          description: Null when the package has no VND plan
        priceUsd:
          type: ["number", "null"]
          description: Null when the package has no USD plan
        onSale:
          type: boolean
          description: Shown on the site (at least one of its plans is visible on Whop)
        recommended:
          type: boolean
        buyers:
          type: integer
          description: Current Whop members across the package's plans
        translations:
          type: string
          enum: [built_in, outdated, none]
          description: >-
            built_in: the site has ready translations for the other languages and they match the English text.
            outdated: the English text changed since they were made. none: no ready translations.
            Languages without a translation show the English text.
      required:
        - key
        - vi
        - en
        - priceVnd
        - priceUsd
        - onSale
        - recommended
        - buyers
        - translations
    AdminPackageTextInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 30
          description: Whop allows at most 30 characters in a plan title
        tagline:
          type: ["string", "null"]
          maxLength: 160
        features:
          type: array
          maxItems: 8
          items:
            type: string
            minLength: 1
            maxLength: 100
      required:
        - name
        - tagline
        - features
    AdminPackageInput:
      type: object
      properties:
        vi:
          $ref: "#/components/schemas/AdminPackageTextInput"
        en:
          $ref: "#/components/schemas/AdminPackageTextInput"
        priceVnd:
          type: integer
          minimum: 10000
          maximum: 1000000000
        priceUsd:
          type: number
          minimum: 1
          maximum: 100000
          description: At most 2 decimals
        onSale:
          type: boolean
        recommended:
          type: boolean
      required:
        - vi
        - en
        - priceVnd
        - priceUsd
        - onSale
        - recommended
