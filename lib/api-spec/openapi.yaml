          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Language:
      type: string
      enum: [vi, en, zh-CN, zh-TW, ja, ko, th, id, ms, fil, km, lo, hi, bn, ur, ar, fa, he, tr, ru, uk, pl, cs, de, fr, es, pt, it, nl, sv, el, ro, hu]
      description: Site language (BCP 47 code)
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [visitor, admin]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        translated:
          type: boolean
          description: The reply is shown machine-translated into the customer's language
      required:
        - id
        - sender
        - body
        - createdAt
        - translated
    ChatThread:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - status
        - messages
    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        lang:
          $ref: "#/components/schemas/Language"
      required:
        - message
        - lang
    AdminMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - message
    AdminChatMessage:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [visitor, admin]
        body:
          type: string
          description: The text as written
        createdAt:
          type: string
          format: date-time
        lang:
          type: ["string", "null"]
          description: Language of the body (BCP 47); null while unknown
        translation:
          type: ["string", "null"]
          description: >-
            Customer messages in Vietnamese; replies in the customer's language,
            which is what the customer reads
        translationLang:
          type: ["string", "null"]
          description: Language of the translation, or that a failed reply was meant for
        translationStatus:
          type: ["string", "null"]
          enum: [done, same, failed, null]
          description: >-
            null when not tried yet; same when there is nothing to translate;
            failed means a customer reads the reply as written
      required:
        - id
        - sender
        - body
        - createdAt
        - lang
        - translation
        - translationLang
        - translationStatus
    AdminTranslateInput:
      type: object
      properties:
        messageIds:
          type: array
          minItems: 1
          maxItems: 10
          items:
            type: integer
      required:
        - messageIds
    AdminConversationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
      required:
        - status
    SampleImage:
      type: object
      properties:
        url:
          type: string
          description: Full-size image
        thumbUrl:
          type: string
          description: Small preview showing the top of the image
        width:
          type: integer
        height:
          type: integer
      required:
        - url
        - thumbUrl
        - width
        - height
    AdminSampleImage:
      type: object
      properties:
        path:
          type: string
          description: Object path of the full-size image
        thumb:
          type: string
          description: Object path of the preview
        width:
          type: integer
        height:
          type: integer
        url:
          type: string
        thumbUrl:
          type: string
      required:
        - path
        - thumb
        - width
        - height
        - url
        - thumbUrl
    AdminSampleImageInput:
      type: object
      properties:
        path:
          type: string
          pattern: "^/objects/uploads/[0-9a-f-]{36}$"
        thumb:
          type: string
          pattern: "^/objects/uploads/[0-9a-f-]{36}$"
        width:
          type: integer
          minimum: 1
          maximum: 20000
        height:
          type: integer
          minimum: 1
          maximum: 20000
      required:
        - path
        - thumb
        - width
        - height
    AdminSampleOrderInput:
      type: object
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items:
            type: string
            pattern: "^[A-Za-z0-9_-]{6,32}$"
      required:
        - ids
    UploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
          description: Signed App Storage link for one PUT upload, valid for 15 minutes
        objectPath:
          type: string
          description: Object path to send back when saving the sample (e.g. /objects/uploads/uuid)
        metadata:
          $ref: "#/components/schemas/UploadUrlRequest"
      required:
        - uploadURL
        - objectPath
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        reason:
          $ref: "#/components/schemas/ErrorReason"
      required:
        - error
    ErrorReason:
      type: string
      description: >-
        Why a customer request failed, so the site can say it in the visitor's language.
        invalid_email: not an email address. email_not_allowed: the provider is not one of the common ones.
        weak_password: under 8 characters. wrong_credentials: wrong email or password. locked: the account was locked.
        too_many: too many attempts. wrong_code: the code does not match. code_expired: no code waiting, expired or tried
        too often. mail_failed: the email could not be sent. payments_off: bank details not set up yet. pending_limit: too
        many unpaid orders. package_gone / sample_gone: no longer on sale. sample_required: the package needs a sample.
        not_cancellable: the order can no longer be cancelled. no_order: chat needs an order.
      enum: [invalid_input, invalid_email, email_not_allowed, weak_password, wrong_credentials, locked, too_many, wrong_code, code_expired, mail_failed, payments_off, pending_limit, package_gone, sample_gone, sample_required, not_cancellable, no_order]
    Package:
      type: object
      description: A package on the price list. Buyers pay the VND price by bank transfer.
      properties:
        id:
          type: string
          description: Package key
        name:
          type: string
        tagline:
          type: ["string", "null"]
          description: One-line summary of who the package is for
        features:
          type: array
          items:
            type: string
          description: What the buyer gets, in display order
        price:
          type: integer
          description: Price in VND, the amount to transfer
        priceUsd:
          type: ["number", "null"]
          description: Approximate price in US dollars, shown next to the VND price; null when not set
        recommended:
          type: boolean
          description: True for the package the studio recommends most
        pickSample:
          type: boolean
          description: >-
            True when the buyer picks one of the source samples before ordering. Stays false while no sample is
            on show, so the package can always be ordered.
      required:
        - id
        - name
        - tagline
        - features
        - price
        - priceUsd
        - recommended
        - pickSample
    AccountCredentials:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
        password:
          type: string
          minLength: 1
          maxLength: 128
        lang:
          $ref: "#/components/schemas/Language"
      required:
        - email
        - password
        - lang
    PasswordResetInput:
      type: object
      properties:
        email:
          type: string
          minLength: 1
          maxLength: 200
        lang:
          $ref: "#/components/schemas/Language"
      required:
