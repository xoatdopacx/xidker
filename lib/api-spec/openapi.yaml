openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Packages on sale, paid by bank transfer (VietQR)
  - name: account
    description: Customer accounts with a confirmed email; the admin signs in here too
  - name: orders
    description: Orders, bank transfer details and the source code download
  - name: support
    description: Support chat for customers with an order
  - name: admin
    description: Studio dashboard with orders, customers, packages, samples, chat inbox and settings
  - name: samples
    description: Source samples that buyers of some packages pick from before ordering
  - name: storage
    description: Uploaded sample images and source code zips in App Storage
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List the packages on sale
      description: >-
        Every visible package, cheapest first. Prices are in VND, paid by bank transfer; priceUsd is an approximate figure for visitors from other countries.
      parameters:
        - name: lang
          in: query
          required: false
          description: Language for the package name, tagline and features. Defaults to vi. Other languages use the built-in translations while the English text matches them, else the English text.
          schema:
            $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Packages on sale
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
        "400":
          description: Invalid lang value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/register:
    post:
      operationId: registerAccount
      tags: [account]
      summary: Start a new account and email a 6-digit code
      description: >-
        The account is created only when the code is confirmed (POST /account/verify) from this browser. If the address already has an account, an email saying so is sent instead and the answer looks the same, so nobody can find out which addresses have accounts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCredentials"
      responses:
        "200":
          description: Code sent (or the already-registered note)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountChallenge"
        "400":
          description: Invalid input; reason says which field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/login:
    post:
      operationId: signInAccount
      tags: [account]
      summary: Sign in with email and password
      description: >-
        Signs in straight away, or emails a code first: for the admin every time, and for an account whose email is not confirmed yet. Signing in signs every other browser of the account out.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCredentials"
      responses:
        "200":
          description: Signed in, or a code was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignInResult"
        "400":
          description: Invalid input; reason says which field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong email or password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/password-reset:
    post:
      operationId: requestPasswordReset
      tags: [account]
      summary: Email a code to set a new password
      description: >-
        Always answers the same way, so nobody can find out which addresses have accounts; the code only goes out when the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetInput"
      responses:
        "200":
          description: Code sent if the account exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountChallenge"
        "400":
          description: Invalid input; reason says which field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/verify:
    post:
      operationId: verifyAccountCode
      tags: [account]
      summary: Confirm the emailed code and sign in
      description: >-
        Uses the code asked for from this browser. For a password reset the new password comes with the code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountCodeInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
        "400":
          description: Invalid input; reason says which field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: No code is waiting, or it expired or was tried too often
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/resend:
    post:
      operationId: resendAccountCode
      tags: [account]
      summary: Email a new code for the step this browser is on
      responses:
        "200":
          description: New code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountChallenge"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: No code is waiting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Email could not be sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /account/session:
    get:
      operationId: getAccountSession
      tags: [account]
      summary: Get the account this browser is signed in to
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
  /account/logout:
    post:
      operationId: signOutAccount
      tags: [account]
      summary: Sign this browser out
      description: >-
        Also ends the admin session of this browser.
      responses:
        "204":
          description: Signed out
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders:
    get:
      operationId: listMyOrders
      tags: [orders]
      summary: List the signed-in customer's orders, newest first
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderSummary"
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: createOrder
      tags: [orders]
      summary: Order a package and get the bank transfer details
      description: >-
        The order waits until the studio sees the transfer and marks it paid. At most 3 orders can wait at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderInput"
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "400":
          description: Invalid input; reason says which field
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package or sample not on sale any more
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Too many unpaid orders
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payments are not set up yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{code}:
    get:
      operationId: getMyOrder
      tags: [orders]
      summary: Get one of the signed-in customer's orders
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^XID[0-9A-Z]{6}$"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such order on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{code}/transferred:
    post:
      operationId: reportOrderTransfer
      tags: [orders]
      summary: Tell the studio the money was sent
      description: >-
        Emails the studio once; the order stays unpaid until the studio confirms the money arrived.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^XID[0-9A-Z]{6}$"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such order on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The order is not waiting for payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{code}/cancel:
    post:
      operationId: cancelMyOrder
      tags: [orders]
      summary: Cancel an order that was not paid
      description: >-
        Only before the customer said the money was sent.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^XID[0-9A-Z]{6}$"
      responses:
        "200":
          description: Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such order on this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: The order can no longer be cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /orders/{code}/download:
    get:
      operationId: downloadOrderFile
      tags: [orders]
      summary: Download the source code of a paid order
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^XID[0-9A-Z]{6}$"
      responses:
        "200":
          description: The zip file
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "401":
          description: Not signed in, or signed out by a sign-in on another browser
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No such order, not paid, or no file yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /support/thread:
    get:
      operationId: getSupportThread
      tags: [support]
      summary: Get the signed-in customer's support conversation
      description: Empty until the customer sends a first message.
      responses:
        "200":
          description: The conversation, newest 200 messages in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
  /support/thread/messages:
    post:
      operationId: sendSupportMessage
      tags: [support]
      summary: Send a message in the signed-in customer's conversation
      description: The first message starts the conversation. Only accounts with an order can chat.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SupportAuthError"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: signOutAdmin
      tags: [admin]
      summary: Sign out this admin browser
      responses:
        "204":
          description: Signed out
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Figures for the dashboard home
      responses:
        "200":
          description: Overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      summary: Search orders, newest first (at most 300)
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [all, waiting, reported, paid, cancelled]
          description: waiting = not paid and the buyer did not say they sent money; reported = they did
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Part of the order code or the buyer email
      responses:
        "200":
          description: Orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/orders/{code}:
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      summary: Mark an order paid, cancel or reopen it, or attach a file and notes
      description: >-
        Marking an order paid emails the buyer that the download is ready.
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
            pattern: "^XID[0-9A-Z]{6}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminOrderUpdate"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOrder"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: That status change is not allowed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many changes, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers:
    get:
      operationId: listAdminCustomers
      tags: [admin]
      summary: Search customer accounts, newest first (at most 300)
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 100
          description: Part of the email
      responses:
        "200":
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminCustomer"
        "400":
          description: Invalid filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/customers/{id}:
    patch:
      operationId: updateAdminCustomer
      tags: [admin]
      summary: Lock or unlock a customer account
      description: >-
        Locking signs the account out everywhere and stops sign-in, orders and chat.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            pattern: "^[A-Za-z0-9_-]{6,64}$"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCustomerUpdate"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCustomer"
        "400":
          description: Invalid input, or the admin account itself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Account not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations:
    get:
      operationId: listAdminConversations
      tags: [admin]
      summary: List chat conversations, most recent activity first
      responses:
        "200":
          description: Up to 200 conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConversation"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}:
    patch:
      operationId: updateAdminConversation
      tags: [admin]
      summary: Close or reopen a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}/messages:
    get:
      operationId: listAdminMessages
      tags: [admin]
      summary: Read a conversation and mark it as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Newest 500 messages in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminChatMessage"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendAdminMessage
      tags: [admin]
      summary: Reply in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminMessageInput"
      responses:
        "201":
          description: Reply stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
