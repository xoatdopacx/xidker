openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: packages
    description: Landing page build packages sold through Whop
  - name: checkout
    description: Whop hosted checkout sessions and verified payment status
  - name: chat
    description: Live chat between site visitors and the studio
  - name: admin
    description: Studio admin sign-in and chat inbox
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /packages:
    get:
      operationId: listPackages
      tags: [packages]
      summary: List purchasable packages
      description: Returns every visible package in every currency. The same package sold in another currency is a separate Whop plan sharing the same key. Sorted by currency, then price ascending.
      parameters:
        - name: lang
          in: query
          required: false
          description: Language for the package name, tagline and features. Defaults to vi. Text comes from Whop (plan title/description and name_<lang> metadata), then from the built-in translations, and falls back to English when a translation is missing or out of date.
          schema:
            $ref: "#/components/schemas/Language"
      responses:
        "200":
          description: Packages available for purchase
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Package"
        "400":
          description: Invalid lang value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout:
    post:
      operationId: createCheckout
      tags: [checkout]
      summary: Start a Whop hosted checkout for a package
      description: Creates a Whop checkout session for the chosen package and returns the hosted checkout URL to send the buyer to. After paying, Whop sends the buyer back to /cam-on?ref={ref}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutInput"
      responses:
        "201":
          description: Checkout session created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSession"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /checkout/{ref}:
    get:
      operationId: getCheckoutStatus
      tags: [checkout]
      summary: Get the verified payment status of a checkout
      description: Asks Whop whether the checkout identified by ref has been paid. Status is "pending" until Whop reports a successful payment.
      parameters:
        - name: ref
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutStatus"
        "404":
          description: Checkout not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Payment provider unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/thread:
    get:
      operationId: getChatThread
      tags: [chat]
      summary: Get this visitor's chat conversation
      description: The conversation is identified by the httpOnly chat cookie set when it was started. Returns 404 when this browser has not started one.
      responses:
        "200":
          description: The visitor's conversation, newest 200 messages in order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "404":
          description: This browser has no conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: startChatThread
      tags: [chat]
      summary: Start a conversation with a first message
      description: Creates the conversation, stores the first message and sets the httpOnly chat cookie that identifies this browser from now on.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatStartInput"
      responses:
        "201":
          description: Conversation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatThread"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many conversations or messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /chat/thread/messages:
    post:
      operationId: sendChatMessage
      tags: [chat]
      summary: Send a message in this visitor's conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Message stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: This browser has no conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login:
    post:
      operationId: requestAdminCode
      tags: [admin]
      summary: Check the admin token and email a one-time code
      description: When the token is right, a 6-digit code valid for 10 minutes is emailed to the admin address and an httpOnly cookie ties the code to this browser.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminTokenInput"
      responses:
        "202":
          description: Code sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminCodeChallenge"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: Admin sign-in or email sending is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/login/verify:
    post:
      operationId: verifyAdminCode
      tags: [admin]
      summary: Check the emailed code and sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminCodeInput"
      responses:
        "200":
          description: Signed in; the httpOnly admin session cookie is set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Wrong, expired or already used code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many attempts, request a new code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get the current admin session
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: signOutAdmin
      tags: [admin]
      summary: Sign out this admin browser
      responses:
        "204":
          description: Signed out
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations:
    get:
      operationId: listAdminConversations
      tags: [admin]
      summary: List chat conversations, most recent activity first
      responses:
        "200":
          description: Up to 200 conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminConversation"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}:
    patch:
      operationId: updateAdminConversation
      tags: [admin]
      summary: Close or reopen a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConversationUpdate"
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConversation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /admin/conversations/{id}/messages:
    get:
      operationId: listAdminMessages
      tags: [admin]
      summary: Read a conversation and mark it as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Newest 500 messages in order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChatMessage"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: sendAdminMessage
      tags: [admin]
      summary: Reply in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatMessageInput"
      responses:
        "201":
          description: Reply stored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatMessage"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Request did not come from this site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Conversation not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many messages, try again later
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    Language:
      type: string
      enum: [vi, en, zh-CN, zh-TW, ja, ko, th, id, ms, fil, km, lo, hi, bn, ur, ar, fa, he, tr, ru, uk, pl, cs, de, fr, es, pt, it, nl, sv, el, ro, hu]
      description: Site language (BCP 47 code)
    Package:
      type: object
      description: A landing page build package, backed by a Whop plan.
      properties:
        id:
          type: string
          description: Whop plan id
        key:
          type: string
          description: Package group. The same package sold in different currencies shares one key (Whop plan metadata "key").
        name:
          type: string
        tagline:
          type: ["string", "null"]
          description: One-line summary of who the package is for
        features:
          type: array
          items:
            type: string
          description: What the buyer gets, in display order
        price:
          type: number
          description: Price in major currency units (e.g. 5990000 = 5.990.000 VND, 249 = $249)
        currency:
          type: string
          description: ISO 4217 currency code, lowercase (e.g. "vnd", "usd")
        billing:
          type: string
          enum: [one_time, recurring]
        billingPeriodDays:
          type: ["integer", "null"]
          description: Days between charges for recurring packages, null for one-time
        recommended:
          type: boolean
          description: True for the package the studio recommends most
      required:
        - id
        - key
        - name
        - tagline
        - features
        - price
        - currency
        - billing
        - billingPeriodDays
        - recommended
    CheckoutInput:
      type: object
      properties:
        packageId:
          type: string
          minLength: 1
      required:
        - packageId
    CheckoutSession:
      type: object
      properties:
        ref:
          type: string
          description: Reference for this checkout, used on the /cam-on page
        purchaseUrl:
          type: string
          description: Whop hosted checkout URL to send the buyer to
      required:
        - ref
        - purchaseUrl
    CheckoutStatus:
      type: object
      properties:
        ref:
          type: string
        status:
          type: string
          enum: [paid, pending]
        packageId:
          type: string
        packageName:
          type: string
        amount:
          type: ["number", "null"]
          description: Amount paid in major currency units, null until paid
        currency:
          type: ["string", "null"]
        paidAt:
          type: ["string", "null"]
          format: date-time
      required:
        - ref
        - status
        - packageId
        - packageName
        - amount
        - currency
        - paidAt
    ChatMessage:
      type: object
      properties:
        id:
          type: integer
        sender:
          type: string
          enum: [visitor, admin]
        body:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - sender
        - body
        - createdAt
    ChatThread:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
        name:
          type: ["string", "null"]
        messages:
          type: array
          items:
            $ref: "#/components/schemas/ChatMessage"
      required:
        - status
        - name
        - messages
    ChatStartInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
        name:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 200
          description: Optional; an empty string means not given
        lang:
          $ref: "#/components/schemas/Language"
        website:
          type: string
          maxLength: 200
          description: Must stay empty. Hidden from people; automated form fillers fill it in.
      required:
        - message
        - lang
    ChatMessageInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
      required:
        - message
    AdminTokenInput:
      type: object
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 512
      required:
        - token
    AdminCodeChallenge:
      type: object
      properties:
        sentTo:
          type: string
          description: The admin address with most of it hidden
        expiresAt:
          type: string
          format: date-time
      required:
        - sentTo
        - expiresAt
    AdminCodeInput:
      type: object
      properties:
        code:
          type: string
          pattern: "^[0-9]{6}$"
      required:
        - code
    AdminSession:
      type: object
      properties:
        expiresAt:
          type: string
          format: date-time
      required:
        - expiresAt
    AdminConversation:
      type: object
      properties:
        id:
          type: string
        name:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        lang:
          type: string
        status:
          type: string
          enum: [open, closed]
        createdAt:
          type: string
          format: date-time
        lastMessageAt:
          type: string
          format: date-time
        lastMessage:
          type: ["string", "null"]
          description: Start of the newest message
        lastSender:
          type: ["string", "null"]
          enum: [visitor, admin, null]
        unread:
          type: integer
          description: Visitor messages the admin has not opened yet
      required:
        - id
        - name
        - email
        - lang
        - status
        - createdAt
        - lastMessageAt
        - lastMessage
        - lastSender
        - unread
    AdminConversationUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [open, closed]
      required:
        - status
